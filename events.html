<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body onload="alert('the page is reloaded')">
    <input type="text" onchange="alert('changes are done')">
    <input type="text" onclick="alert('changes have passed while clicking')">
    <input type="text" onmouseover="alert('mouse is pointed on the bar')">
    <input type="text" onmouseout="alert('mouse is taken from bar')">
    <input type="text" onkeyup="alert('hello your key is up ')">
    <input type="text" onkeydown="alert('hello the key is down')">
    
    <form action="" onsubmit="alert('submited successfully')">
        <label for="">name</label>
        <input type="text" required>
        <button type="submit">click</button>
    </form>
</body>
</html>
